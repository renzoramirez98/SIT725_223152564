
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIT725 Addition Calculator</title>
</head>

<body>

    <!-- Main heading -->
    <h1>SIT725 Addition Calculator</h1>

    <p>Enter two numbers to calculate their sum.</p>

    <!-- Send the numbers to our Express server -->
    <form action="/add" method="GET">

        <!-- First number -->
        <label for="a">First number:</label>
        <input type="number" id="a" name="a" step="any" required>

        <br><br>

        <!-- Second number -->
        <label for="b">Second number:</label>
        <input type="number" id="b" name="b" step="any" required>

        <br><br>

        <!-- Submit the form -->
        <button type="submit">Calculate</button>

    </form>

</body>
</html>
